<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B0910; }
  * { box-sizing: border-box; }
  a { color: #F249A0; text-decoration: none; }
  a:hover { color: #FF6FB8; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
</style>
</helmet>
<div style="height: 100vh; width: 100vw; background: #0B0910; color: #F4EEF6; font-family: 'Space Grotesk', sans-serif; display: grid; grid-template-columns: 240px 1fr; overflow: hidden;">

  <aside style="border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px;">
    <a href="CRM.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; color: #b0a2ba; font-size: 14px; font-family: 'Space Grotesk', sans-serif; transition: background 0.15s ease, color 0.15s ease;" style-hover="background: rgba(255,255,255,0.06); color: #F4EEF6;">
      <span style="font-size: 16px; width: 18px; text-align: center;">◧</span>Painel
    </a>
    <a href="JimmyConfig.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; color: #b0a2ba; font-size: 14px; font-family: 'Space Grotesk', sans-serif; transition: background 0.15s ease, color 0.15s ease;" style-hover="background: rgba(255,255,255,0.06); color: #F4EEF6;">
      <span style="font-size: 16px; width: 18px; text-align: center;">⚙</span>Configurações
    </a>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;">
        <img src="uploads/761a440f4d38e77c845b67badf122797.jpg" alt="usuário" style="width: 100%; height: 100%; object-fit: cover;" />
      </div>
      <span style="font-size: 13px; color: #F4EEF6;">Natanael</span>
    </div>
  </aside>

  <div style="display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(120% 100% at 85% 0%, #1a1122 0%, #0B0910 55%);">

  <header style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px clamp(20px, 3vw, 40px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="position: relative; width: 34px; height: 34px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(242,73,160,0.3);">
        <img src="uploads/761a440f4d38e77c845b67badf122797.jpg" alt="Jimmy" style="width: 100%; height: 100%; object-fit: cover;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-weight: 600; font-size: 15px; color: #F4EEF6;">Jimmy</span>
        <span style="display: flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #7c8894; letter-spacing: 0.04em;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #7CF2A6; box-shadow: 0 0 6px #7CF2A6;"></span>ONLINE
        </span>
      </div>
    </div>
    <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a7c96;">IRIS MACHINE</span>
  </header>

  <div ref="{{ scrollRef }}" style="flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 28px clamp(20px, 4vw, 40px); max-width: 780px; width: 100%; margin: 0 auto;">
    <sc-for list="{{ messages }}" as="msg" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; justify-content: {{ msg.justify }}; animation: fadeUp 0.35s ease both;">
        <sc-if value="{{ msg.isAgent }}" hint-placeholder-val="{{ true }}">
          <div style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; overflow: hidden; margin-top: 2px;">
            <img src="uploads/761a440f4d38e77c845b67badf122797.jpg" alt="Jimmy" style="width: 100%; height: 100%; object-fit: cover;" />
          </div>
        </sc-if>
        <div style="max-width: 72%; display: flex; flex-direction: column; gap: 4px; align-items: {{ msg.align }};">
          <div style="padding: 12px 16px; border-radius: {{ msg.radius }}; background: {{ msg.bg }}; border: {{ msg.border }}; font-size: 14.5px; line-height: 1.55; color: {{ msg.color }}; white-space: pre-wrap;">{{ msg.text }}</div>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{ isTyping }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 12px; justify-content: flex-start;">
        <div style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; overflow: hidden; margin-top: 2px;">
          <img src="uploads/761a440f4d38e77c845b67badf122797.jpg" alt="Jimmy" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div style="padding: 14px 16px; border-radius: 4px 16px 16px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; gap: 5px; align-items: center;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #b5a3c0; animation: blink 1.2s infinite; animation-delay: 0s;"></span>
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #b5a3c0; animation: blink 1.2s infinite; animation-delay: 0.2s;"></span>
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #b5a3c0; animation: blink 1.2s infinite; animation-delay: 0.4s;"></span>
        </div>
      </div>
    </sc-if>
  </div>

  <form onsubmit="{{ handleSubmit }}" style="flex: 0 0 auto; padding: 18px clamp(20px, 4vw, 40px) 26px; max-width: 780px; width: 100%; margin: 0 auto; box-sizing: border-box;">
    <div style="display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 18px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
      <textarea rows="1" placeholder="Envie uma mensagem para o Jimmy…" value="{{ input }}" onChange="{{ handleChange }}" onKeyDown="{{ handleKeyDown }}" style="flex: 1 1 auto; resize: none; background: transparent; border: none; outline: none; color: #F4EEF6; font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; line-height: 1.5; padding: 6px 0; max-height: 120px;"></textarea>
      <button type="submit" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; border: none; background: #F249A0; color: #ffffff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s ease;" style-hover="transform: translateY(-1px);">↑</button>
    </div>
    <div style="text-align: center; margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #59636d; letter-spacing: 0.03em;">Jimmy pode cometer erros. Verifique informações importantes.</div>
  </form>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:700}}">
class Component extends DCLogic {
  state = {
    input: "",
    isTyping: false,
    showMessages: false,
    messages: [
      { text: "Olá! Eu sou o Jimmy, especialista em conversão e portabilidade de código entre plataformas. Me envie um trecho ou descreva o que precisa migrar.", isAgent: true },
    ],
    messageLog: JSON.parse(localStorage.getItem("jimmy_message_log") || "[]"),
  };

  scrollRef = React.createRef();

  scrollToBottom() {
    requestAnimationFrame(() => {
      if (this.scrollRef.current) this.scrollRef.current.scrollTop = this.scrollRef.current.scrollHeight;
    });
  }

  componentDidMount() { this.scrollToBottom(); }
  componentDidUpdate() { this.scrollToBottom(); }

  send() {
    const text = this.state.input.trim();
    if (!text) return;
    this.setState(s => {
      let messageLog = s.messageLog;
      if (!messageLog.length) {
        const title = text.length > 40 ? text.slice(0, 40) + "…" : text;
        messageLog = [title];
        localStorage.setItem("jimmy_message_log", JSON.stringify(messageLog));
      }
      return { input: "", messages: [...s.messages, { text, isAgent: false }], isTyping: true, messageLog };
    });
    setTimeout(() => {
      this.setState(s => ({
        isTyping: false,
        messages: [...s.messages, { text: "Entendido. Vou analisar a estrutura e retornar com o plano de portabilidade em instantes.", isAgent: true }],
      }));
    }, 1400);
  }

  renderVals() {
    const bubble = (m) => m.isAgent
      ? { justify: "flex-start", align: "flex-start", bg: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", color: "#E7DCE9", radius: "4px 16px 16px 16px" }
      : { justify: "flex-end", align: "flex-end", bg: "#F249A0", border: "none", color: "#ffffff", radius: "16px 4px 16px 16px" };

    return {
      input: this.state.input,
      isTyping: this.state.isTyping,
      scrollRef: this.scrollRef,
      showMessages: this.state.showMessages,
      messageLog: this.state.messageLog,
      messagesColor: this.state.showMessages ? "#F4EEF6" : "#7c8894",
      messagesBg: this.state.showMessages ? "rgba(255,255,255,0.06)" : "transparent",
      toggleMessages: () => this.setState(s => ({ showMessages: !s.showMessages })),
      messages: this.state.messages.map(m => ({ ...m, ...bubble(m) })),
      handleChange: (e) => this.setState({ input: e.target.value }),
      handleKeyDown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.send(); } },
      handleSubmit: (e) => { e.preventDefault(); this.send(); },
    };
  }
}
</script>
</body>
</html>
